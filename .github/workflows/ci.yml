name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 环境自检
        run: node src/cli.js doctor --data /tmp/highurl-ci
      - name: 单元与集成测试
        run: node --test
      - name: 跳转压测冒烟
        run: node scripts/bench.js --links 100 --conns 32 --duration 3
